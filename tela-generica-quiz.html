<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Geral do Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #0f172a;
            font-family: 'Cinzel', serif;
        }

        /* Topbar / Barra do Menu (Bloco superior) */
        .topbar {
            position: sticky;
            width: 100%;
            height: 65px;
            background: #1e293b;
            border-bottom: 2px solid rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .btn-menu {
            background: linear-gradient(135deg, #334155, #1e293b);
            color: #f1d592;
            border: 1px solid #d4af37;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .btn-menu:hover {
            background: #d4af37;
            color: #0f172a;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* Área Principal / Container do iframe */
        .content-area {
            display: flex;
            justify-content: center;
            align-items: center;
            
        }

        
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <header class="topbar">
        <button class="btn-menu" onclick="voltarAoMenu()">MENU</button>
    </header>

    <!-- Área da Tela com o iframe separado para cada quiz -->
    <main class="content-area">
  <div style="width: 100%;"><div style="position: relative; padding-bottom: 200%; padding-top: 0; height: 0;"><iframe title="Genially sem título" frameborder="0" width="450" height="900" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" src="https://view.genially.com/6a6366e4c510041ac6e5cb22" type="text/html" allowscriptaccess="always" allowfullscreen="true" scrolling="yes" allownetworking="all"></iframe> </div> </div>     
</main>

    <script>
        function voltarAoMenu() {
            // Redireciona de volta para a página do menu principal
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
