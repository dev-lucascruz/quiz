<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site com Música</title>
    <link rel="stylesheet" href="style.css">
    <style>
/*         html, body, main, section, #embed-iframe {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        } */
        /* Camada invisível que cobre a tela inteira inicialmente para pegar o clique */
        #clique-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99999;
            cursor: pointer;
            background: transparent;
        }
    </style>
</head>
<body>
    <audio id="meuAudio" src="https://s3.ustatik.com/audio.com.audio/transcoding/94/18/1832179069711894-1832179069893321-1832179073440598.mp3?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=F0E8U41NBMMW3Y027UTJ%2F20260728%2Feu-central-1%2Fs3%2Faws4_request&X-Amz-Date=20260728T132349Z&X-Amz-SignedHeaders=host&X-Amz-Expires=518400&X-Amz-Signature=3f049b838e4fba2dc035869ade55eb6aa96430f5467c8c416d7d686a689269b4" loop>     
    </audio>
    <main>
        <section>
            <div id="clique-overlay"></div>
            <div id="intro">
                <img src="teste.png" alt="erro">
                <h2>ESTOU PRONTA</h2>
            </div>
            <div id="menu-quiz">
                <a href="index copy.html">
                    <h1>TESTE</h1>
                </a>
            </div>
            <div id="embed-iframe">
                <div style="width: 100%;"><div style="position: relative; padding-bottom: 200%; padding-top: 0; height: 0;"><iframe title="Genially sem título" frameborder="0" width="450" height="900" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" src="https://view.genially.com/6a6366e4c510041ac6e5cb22" type="text/html" allowscriptaccess="always" allowfullscreen="true" scrolling="yes" allownetworking="all"></iframe> </div> </div>   
            </div>
            
        </section>
        
    </main>

    <script>
        // O clique em qualquer lugar da tela (inclusive no primeiro toque em cima do Genially) vai cair aqui
        document.getElementById('clique-overlay').addEventListener('click', function() {
            const audio = document.getElementById('meuAudio');
            const iframe = document.getElementById('embed-iframe');
            const intro = document.getElementById('intro');
            const menu = document.getElementById('menu-quiz');
            iframe.style.display = "block";
            intro.style.display = "none";
            menu.style.display = "block";

            if (audio) {
                audio.muted = false;
                audio.play().catch(error => {
                    console.log("Erro ao reproduzir áudio:", error);
                });
            }

            // Remove a camada invisível para que os próximos cliques passem direto para o Genially
            this.remove();
        });
    </script>
</body>
</html>
